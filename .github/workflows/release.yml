name: Test and Package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux-amd64
          - os: windows-2022
            artifact: windows-x64
          - os: macos-15
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.0"
          python-version: "3.12"
      - name: Linux runtime prerequisites
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libportaudio2 libasound2 libxcb-cursor0 libxkbcommon-x11-0 libegl1
          libgl1 libdbus-1-3 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
          libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libglib2.0-0
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - run: uv sync --locked --group build
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build and run packaged codec/Qt smoke test
        run: uv run --locked --group build python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: AudioLoopbackTester-${{ matrix.artifact }}
          path: dist/installers/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.artifact }}
          path: |
            dist/package-smoke*
            dist/notices*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AudioLoopbackTester-*
          path: release-files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true